name: Parallel 4K 60fps Cloud Rendering Pipeline

on:
  workflow_dispatch:
    inputs:
      codec:
        description: 'Output Video Codec'
        required: true
        default: 'h264'
        type: choice
        options:
          - h264
          - prores
      crf:
        description: 'Constant Rate Factor (CRF 12 for broadcast master)'
        required: true
        default: '12'
        type: string
      batch_target:
        description: 'Render Target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - liquid-chrome
          - iridescent-silk
          - obsidian-gold
          - cyber-grid
          - champagne-bokeh
          - dark-concentric
          - cosmic-nebula
          - bioluminescent
          - quantum-waveguide
          - sacred-geometry
          - paper-topography

jobs:
  render-matrix:
    name: Render ${{ matrix.composition }} (4K 60fps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composition:
          - liquid-chrome
          - iridescent-silk
          - obsidian-gold
          - cyber-grid
          - champagne-bokeh
          - dark-concentric
          - cosmic-nebula
          - bioluminescent
          - quantum-waveguide
          - sacred-geometry
          - paper-topography
    steps:
      - name: Check Filter
        id: filter
        run: |
          if [ "${{ inputs.batch_target }}" = "all" ] || [ "${{ inputs.batch_target }}" = "${{ matrix.composition }}" ]; then
            echo "run_render=true" >> $GITHUB_OUTPUT
          else
            echo "run_render=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout Repository
        if: steps.filter.outputs.run_render == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        if: steps.filter.outputs.run_render == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        if: steps.filter.outputs.run_render == 'true'
        run: npm ci || npm install

      - name: Render 4K 60fps Master Video
        if: steps.filter.outputs.run_render == 'true'
        run: |
          mkdir -p out
          EXT="${{ inputs.codec == 'prores' && 'mov' || 'mp4' }}"
          npx remotion render src/index.ts "${{ matrix.composition }}" \
            "out/${{ matrix.composition }}_4k60fps_loop.${EXT}" \
            --codec="${{ inputs.codec || 'h264' }}" \
            --crf="${{ inputs.crf || '12' }}" \
            --pixel-format=yuv420p

      - name: Upload Single Video Artifact
        if: steps.filter.outputs.run_render == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.composition }}
          path: out/*
          retention-days: 14

  package-release:
    name: Package Adobe Stock Master Release Bundle
    needs: render-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Generate Adobe Stock CSV Metadata
        run: npx ts-node scripts/generate-metadata.ts

      - name: Download All Rendered Video Artifacts
        uses: actions/download-artifact@v4
        with:
          path: batch_artifacts
          pattern: video-*
          merge-multiple: true

      - name: Bundle Master Package ZIP
        run: |
          mkdir -p release_package
          cp -r batch_artifacts/* release_package/ || true
          cp adobe_stock_upload.csv release_package/
          cp dist/metadata/adobe_stock_catalog.json release_package/ || true
          
          ZIP_NAME="Loopable_Abstract_Batch_01_4K_Videos_${{ inputs.codec || 'mp4' }}.zip"
          cd release_package
          zip -r "../${ZIP_NAME}" ./*
          cd ..
          echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV

      - name: Upload Complete 1-Click Release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 30
